services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: galaxy
      POSTGRES_PASSWORD: galaxy
      POSTGRES_DB: galaxy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://galaxy:galaxy@db:5432/galaxy
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./apps/api:/app

volumes:
  pgdata: